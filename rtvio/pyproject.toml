[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtvio"
version = "0.1.0"
description = "Georeferenced 3D reconstruction from UAV video + noisy GPS, streamed live from a phone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
    "laspy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# VGGT batch-reconstruction core (see docs/dev_notes for the pivot away from
# the removed EKF/tracker). torch/torchvision are installed separately with
# a CUDA-matched index URL (see README), not through this extra, since the
# right wheel depends on the machine's GPU/driver.
vggt = [
    "huggingface_hub",
    "einops",
    "safetensors",
]
# Meshing/export for the VGGT pipeline. open3d has no wheel for this
# machine's Python (3.13 on Windows, verified against PyPI directly) -
# pymeshlab wraps the same screened-Poisson reconstruction MeshLab/Open3D
# both use, and trimesh handles glTF/GLB export, which pymeshlab doesn't.
mesh = [
    "pymeshlab",
    "trimesh",
]
# Dynamic-object masking (ai_masking.py) - already installed in this
# environment; listed here so a fresh setup gets it too. huggingface_hub is
# for DynamicMasker.for_nadir_aerial()'s VisDrone checkpoint download (see
# HANDOFF_SESSION3.md) - listed here too, not just under vggt, since someone
# could install masking without vggt.
masking = [
    "ultralytics",
    "huggingface_hub",
]

[project.scripts]
rtvio-live = "rtvio.live_pipeline:main"
rtvio-reconstruct = "rtvio.vggt_reconstruct:main"

[tool.setuptools.packages.find]
where = ["src"]
