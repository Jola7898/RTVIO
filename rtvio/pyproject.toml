[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtvio"
version = "0.1.0"
description = "Georeferenced 3D reconstruction from UAV video + noisy GPS, streamed live from a phone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
    "laspy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
rtvio-live = "rtvio.live_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
