plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rtvio.mapper'
    compileSdk 34

    defaultConfig {
        applicationId "com.rtvio.mapper"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1-studio"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField "boolean", "VERBOSE_LOG", "true"
        }
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField "boolean", "VERBOSE_LOG", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // No signingConfig here on purpose: see README "Release signing".
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    // repeatOnLifecycle lives here; activity-ktx pulls it in transitively but
    // the activity depends on it directly.
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    // Explicit rather than leaning on material's transitive dependency:
    // the specs screen is a RecyclerView and should declare what it uses.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Settings screen. The spec's table maps 1:1 onto androidx.preference,
    // which also gives us SharedPreferences persistence for free.
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Camera. camera-camera2 IS the Camera2 implementation behind CameraX,
    // so this satisfies "Camera2, not the deprecated Camera1" while giving us
    // a lifecycle-managed preview + analysis pipeline.
    def cameraxVersion = '1.3.1'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // NOTE (deviation from the spec's dependency list): mDNS/Bonjour discovery
    // uses the platform's android.net.nsd.NsdManager - no third-party library.
    // The spec suggested org.bouncycastle (a crypto provider) and
    // com.github.ServiceComb:java-chassis (a microservice framework); neither
    // does mDNS, and both would add megabytes to the APK. NsdManager speaks
    // _rtvio._tcp natively on API 16+.

    // NOTE: the spec listed androidx.legacy:legacy-support-v4 "for logging".
    // Logging is android.util.Log, which is in the platform. Dropped.

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
